patch:
  "punctuator/full_shape":
    " ": { commit: " " }
    ",": { commit: "," }
    ".": { commit: "." }
    "?": { commit: "?" }
    ";": { commit: ";" }
    ":": { commit: ":" }
  "punctuator/half_shape":
    " ": { commit: " " }
  "schema/dependencies/@next": cangjie5_wildcard
  "engine/translators/@next": table_translator@wildcard
  "engine/filters/@next": reverse_lookup_filter@wildcard_code
  "recognizer/patterns/wildcard": '^[a-z]+[*][a-z]*$'
  "key_binder/bindings/+":
    - { when: composing, accept: KP_Multiply, send: asterisk }
    - { when: has_menu, accept: Tab, send: Down }
    - { when: has_menu, accept: ISO_Left_Tab, send: Up }
    - { when: has_menu, accept: Shift+ISO_Left_Tab, send: Up }
    - { when: has_menu, accept: Shift+Tab, send: Up }
    - { when: has_menu, accept: Right, send: Down }
    - { when: has_menu, accept: Left, send: Up }
    - { when: has_menu, accept: Return, send: space }
  wildcard:
    tag: wildcard
    dictionary: cangjie5
    prism: cangjie5_wildcard
    enable_charset_filter: true
    enable_completion: false
    enable_sentence: false
    enable_user_dict: false
    preedit_format:
      - "xform/^([a-z*]+)$/\\U$1\\E/"
      - { __include: "cangjie5.schema:/translator/preedit_format/@1" }
  wildcard_code:
    tags: [ wildcard ]
    dictionary: cangjie5
    overwrite_comment: true
    comment_format:
      - "xform/^/ /"
      - "xform/ z[a-z]*//"
      - "xform/ x(?= |$)//"
      - "xform/^ +//"
      - "xform| +| / |"
      - "xform/^(.+)$/= $1/"
