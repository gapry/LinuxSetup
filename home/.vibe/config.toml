active_model = "mistral-medium-3.5"
vim_keybindings = false
theme = "ansi-dark"
file_watcher_for_autocomplete = false
bypass_tool_permissions = false
system_prompt_id = "zh_tw" # https://docs.mistral.ai/vibe/code/cli/configuration-reference
auto_compact_threshold = 200000
enabled_tools = ["*"]
outside_workdir = "ask"
default_agent = "ask"
applied_migrations = [
  "bash_read_only_defaults_v1",
]

[experiment_overrides]

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
browser_auth_base_url = "https://console.mistral.ai"
browser_auth_api_base_url = "https://console.mistral.ai/api"
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[providers.extra_headers]

[[providers]]
name = "llamacpp"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[providers.extra_headers]

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 1.0
input_price = 1.5
output_price = 7.5
thinking = "high"
supports_images = true
auto_compact_threshold = 200000

[[models]]
name = "devstral-small-latest"
provider = "mistral"
alias = "devstral-small"
temperature = 0.2
input_price = 0.1
output_price = 0.3
thinking = "off"
supports_images = false
auto_compact_threshold = 200000

[[models]]
name = "devstral"
provider = "llamacpp"
alias = "local"
temperature = 0.2
input_price = 0.0
output_price = 0.0
thinking = "off"
supports_images = false
auto_compact_threshold = 200000

[[transcribe_providers]]
name = "mistral"
api_base = "wss://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[transcribe_models]]
name = "voxtral-mini-transcribe-realtime-2602"
provider = "mistral"
alias = "voxtral-realtime"
sample_rate = 16000
encoding = "pcm_s16le"
language = "en"
target_streaming_delay_ms = 500

[[tts_providers]]
name = "mistral"
api_base = "https://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[tts_models]]
name = "voxtral-mini-tts-latest"
provider = "mistral"
alias = "voxtral-tts"
voice = "gb_jane_neutral"
response_format = "wav"

[experiments]
enable = true
api_host = "https://experiments.mistral.services/"
client_key = "sdk-OE8yJgTXZY6tj" # https://github.com/mistralai/mistral-vibe/blob/c96a6dbb34d34f8a868b3f67b279ecabbf1aa616/vibe/core/config/models.py#L69
 
[session_logging]
save_dir = "~/.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.bash]
permission = "ask"
allowlist = [
  "basename",
  "cd",
  "comm",
  "cut",
  "date",
  "diff",
  "dirname",
  "du",
  "echo",
  "file",
  "fmt",
  "fold",
  "git diff",
  "git log",
  "git status",
  "grep",
  "head",
  "join",
  "ls",
  "md5sum",
  "mkdir",
  "nl",
  "od",
  "paste",
  "pwd",
  "readlink",
  "sha1sum",
  "sha256sum",
  "shasum",
  "stat",
  "sum",
  "tac",
  "tail",
  "tr",
  "tree",
  "uname",
  "uniq",
  "wc",
  "which",
  "whoami",
]
denylist = [
  "rm",
  "/bin/rm",
  "/usr/bin/rm",
  "sudo rm",
  "sudo /bin/rm",
  "sudo /usr/bin/rm",
]
denylist_standalone = []

[tools.todo]
permission = "always"

[tools.exit_plan_mode]
permission = "always"

[tools.edit]
permission = "always"
sensitive_patterns = [
  "**/.env",
  "**/.env.*",
  "**/.git/**",
  "**/.vibe/**",
  "**/.ssh/**",
  "**/.bashrc",
  "**/.profile",
  "**/.gitconfig",
  "**/Makefile",
  "**/build.rs",
  "**/flake.nix",
  "**/.github/workflows/**",
]

[tools.web_search]
permission = "ask"

[tools.write_file]
permission = "always"
sensitive_patterns = [
  "**/.env",
  "**/.env.*",
  "**/.git/**",
  "**/.vibe/**",
  "**/.ssh/**",
  "**/.bashrc",
  "**/.profile",
  "**/.gitconfig",
  "**/Makefile",
  "**/build.rs",
  "**/flake.nix",
  "**/.github/workflows/**",
]

[tools.ask_user_question]
permission = "always"

[tools.web_fetch]
permission = "ask"

[tools.skill]
permission = "ask"

[tools.read_file]
permission = "always"
sensitive_patterns = [
  "**/.env",
  "**/.env.*",
  "**/.git/**",
  "**/.vibe/**",
  "**/.ssh/**",
  "**/.bashrc",
  "**/.profile",
  "**/.gitconfig",
  "**/Makefile",
  "**/build.rs",
  "**/flake.nix",
  "**/.github/workflows/**",
]
max_read_bytes = 51200
